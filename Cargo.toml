[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/rahulmutt/hecaton"
# Nothing here is published to crates.io; path dependencies therefore carry no
# version (cargo-deny: `allow-wildcard-paths` exempts private crates).
publish = false

[workspace.dependencies]
hecaton-api = { path = "crates/hecaton-api" }
hecaton-core = { path = "crates/hecaton-core" }
hecaton-config = { path = "crates/hecaton-config" }
hecaton-plugin-sdk = { path = "crates/hecaton-plugin-sdk" }
hecaton-plugin-flow = { path = "crates/hecaton-plugin-flow" }
hecaton-plugin-matrix = { path = "crates/hecaton-plugin-matrix" }
hecaton-plugin-web = { path = "crates/hecaton-plugin-web" }
hecaton-runtime = { path = "crates/hecaton-runtime" }
hecaton-server = { path = "crates/hecaton-server" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
thiserror = "2.0.20"
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
sha2 = "0.11.0"
hex = "0.4.3"
toml = "1.1.5"
tar = "0.4.46"
flate2 = "1.1.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
axum = { version = "0.8.9", features = ["ws"] }
ureq = { version = "3.4.1", default-features = false, features = ["json"] }
# Async loopback HTTP for the daemon → plugin calls and the plugin SDK
# (plugins spec §16.1). No TLS provider, no HTTP/2, no proxy discovery.
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
# Phase 3 (plugins spec §18.1). hyper, hyper-util and futures-util were
# already in the lock through axum and reqwest and are direct, exact
# dependencies now: the proxy is a plain reverse proxy on hyper's legacy
# client (upgrades passed through as bytes), and the SDK's stream clients
# need Sink/Stream adaptors. tokio-tungstenite (no TLS feature, P3-1) is
# the WebSocket client for the SDK and the tests.
hyper = { version = "1.11.1", features = ["http1", "client"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "tokio"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "0.30.0"
# AgentRunner::attach on tmux (plugins spec §18.4): a PTY for the tmux
# client. The workspace forbids `unsafe`, so the setsid/TIOCSCTTY dance a
# hand-rolled pre_exec would need lives in this crate instead.
portable-pty = "0.9.0"
prometheus = "0.14.0"
# The Matrix client for hecaton-plugin-matrix (Spec G-9), the only crate in
# the workspace that depends on it. Default features carry `e2e-encryption`
# (the crew rooms are encrypted), `sqlite` (the state and crypto store the
# plugin keeps under its scratch dir) and `automatic-room-key-forwarding`;
# `markdown` gives the `body` plus `formatted_body` pair every message the
# plugin sends carries, and `bundled-sqlite` compiles SQLite in so no system
# libsqlite3 is needed. TLS is not a choice here: matrix-sdk exposes no TLS
# feature and depends on reqwest's `rustls` unconditionally.
matrix-sdk = { version = "0.18.0", features = ["markdown", "bundled-sqlite"] }
# The flow plugin's rule matcher (plugins spec §8.1, §17.2): full-match
# regexes with a 10 KiB size limit. Already in the lock through
# tracing-subscriber; now a direct, exact dependency.
regex = "1.13.1"
# Attaches the config path (`states.working.on[1].foo`) to serde's error so
# a plugin config error reads like every other hecaton config error
# (plugins spec §17.2); a hand-written walker would duplicate the schema.
serde_path_to_error = "0.1.20"
chacha20poly1305 = "0.11.0"
rand = "0.10.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# dev
insta = { version = "1.48.0", features = ["yaml", "json"] }
proptest = "1.11.0"
proptest-state-machine = "0.8.0"
tempfile = "3.27.0"
pretty_assertions = "1.4.1"
assert_cmd = "2.2.2"
predicates = "3.1.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
