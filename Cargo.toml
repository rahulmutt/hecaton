[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/rahulmutt/hecaton"

[workspace.dependencies]
hecaton-api = { path = "crates/hecaton-api" }
hecaton-core = { path = "crates/hecaton-core" }
hecaton-config = { path = "crates/hecaton-config" }
hecaton-runtime = { path = "crates/hecaton-runtime" }
hecaton-server = { path = "crates/hecaton-server" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
thiserror = "2.0.20"
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
sha2 = "0.11.0"
hex = "0.4.3"
toml = "1.1.5"
tar = "0.4.46"
flate2 = "1.1.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
axum = "0.8.9"
ureq = { version = "3.4.1", default-features = false, features = ["json"] }
prometheus = "0.14.0"
chacha20poly1305 = "0.11.0"
rand = "0.10.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# dev
insta = { version = "1.48.0", features = ["yaml", "json"] }
proptest = "1.11.0"
proptest-state-machine = "0.8.0"
tempfile = "3.27.0"
pretty_assertions = "1.4.1"
assert_cmd = "2.2.2"
predicates = "3.1.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
