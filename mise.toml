# Every entry is an exact version (developer-environment: an unpinned entry is a reproducibility bug).
# git is a system prerequisite (not in the mise registry); the devcontainer ships 2.47.3.
[tools]
rust = { version = "1.98.1", components = ["rustfmt", "clippy"] }
"cargo:cargo-nextest" = "0.9.143"
cargo-insta = "1.48.0"
"cargo:cargo-audit" = "0.22.2"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"github:sourcefrog/cargo-mutants" = "27.1.0"
gitleaks = "8.30.1"
tmux = "3.7c"
gh = "2.100.0"
nono = "0.76.0"
claude = "2.1.266"

[tasks.fmt]
description = "Format all crates"
run = "cargo fmt --all"

[tasks.lint]
description = "Static tier: rustfmt check + clippy with warnings denied"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
]

[tasks.test]
description = "Unit + integration tests"
depends = ["package-plugins"]
run = "cargo nextest run --workspace"

[tasks.package-plugins]
description = "Build the in-tree plugins and assemble them as directory sources under target/plugins/<name>/ (the e2e and `plugins.yaml` point at these)"
run = "scripts/package-plugins.sh"

[tasks.check]
description = "Everything the PR tier runs"
depends = ["lint", "test"]

[tasks.precommit]
description = "Pre-commit tier: staged secret scan, then the PR gate"
run = [
  "gitleaks git --pre-commit --staged --redact",
  "mise run check",
]

[tasks.audit]
description = "Nightly tier: dependency CVEs and policy"
run = [
  "cargo audit",
  "cargo deny check advisories bans sources licenses",
]

[tasks.mutants]
description = "Nightly tier: mutation-test the reconciler"
run = "cargo mutants -p hecaton-core --in-place"

[tasks.test-it]
description = "Integration tests against real git/mise/nono/tmux, failing (not skipping) when a tool is missing"
env = { HECATON_REQUIRE_TOOLS = "1" }
run = "cargo nextest run -p hecaton-runtime"

[tasks.e2e]
description = "End-to-end journey against a real daemon, git, mise, nono and tmux (fails, not skips, without tools)"
depends = ["package-plugins"]
env = { HECATON_REQUIRE_TOOLS = "1" }
run = "cargo nextest run -p hecaton --test e2e"

[tasks.serve]
# HOME alone is not enough: StateLayout prefers XDG_STATE_HOME/XDG_DATA_HOME/
# XDG_CONFIG_HOME whenever they are set, so on a machine that exports them the
# dev daemon would write its endpoint, pid, token and vault key into the user's
# live hecaton state root and collide with a real daemon. Override all four.
description = "Run a daemon in the foreground under target/tmp/serve (HOME and every XDG root overridden, so it never touches the user's hecaton state)"
env = { HOME = "{{config_root}}/target/tmp/serve/home", XDG_CONFIG_HOME = "{{config_root}}/target/tmp/serve/home/.config", XDG_STATE_HOME = "{{config_root}}/target/tmp/serve/home/.local/state", XDG_DATA_HOME = "{{config_root}}/target/tmp/serve/home/.local/share" }
run = [
  "mkdir -p target/tmp/serve/home",
  "cargo run -q -p hecaton -- serve --tmux-socket hecaton-dev",
]

[tasks.verify-claude]
description = "By-hand spec §8.1 check: a real claude under a scratch daemon (config and state under target/tmp/verify-claude, wiped each run; tool installs kept under target/tmp/verify-data; your HOME kept for credentials); pauses for you to attach and type one prompt, then prints a report to paste back"
run = "scripts/verify-claude.sh"
