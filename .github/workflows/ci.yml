name: ci
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly tier
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with: { install: true, cache: true }
      - run: mise run check
  audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with: { install: true, cache: true }
      - run: mise run audit
